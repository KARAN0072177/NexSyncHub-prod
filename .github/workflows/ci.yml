
name: NexSyncHub CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Validate NexSyncHub Web App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexsynchub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexsynchub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (temporary baseline)
        continue-on-error: true
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build
        env:
          CI: true
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/ci_build' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci_dummy_nextauth_secret_key_32chars_long' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITEKEY || '1x00000000000000000000AA' }}

  validate-socket:
    name: Validate Socket Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: socket-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: socket-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax
        run: node --check server.mjs
